<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solitaire</title>
  <script src="/js/app.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
  <style>
    .table {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--felt);
      user-select: none;
      touch-action: none;
      font-size: calc(var(--fs-head) * var(--card-scale));
    }
    .slot {
      position: absolute;
      border: var(--hairline) solid var(--card-slot);
      border-radius: var(--r-card);
    }
    .card {
      position: absolute;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: calc(var(--sp-4) * var(--card-scale));
      border: var(--hairline) solid var(--card-edge);
      border-radius: var(--r-card);
      background: var(--card-face);
      box-shadow: var(--card-shadow);
      color: var(--card-black);
      font-family: var(--font-ui);
      cursor: default;
    }
    .card.is-red { color: var(--card-red); }
    .card__corner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: start;
      width: var(--card-index);
      font-weight: 700;
      line-height: var(--lh-card);
    }
    .card__corner--end { justify-self: end; rotate: 180deg; }
    .card__rank.is-ten { letter-spacing: var(--ls-card-ten); }
    .card__middle { display: grid; place-items: center; font-size: var(--card-pip); }
    .card.is-face .card__middle { font-weight: 700; font-size: var(--card-letter); }
    .card.is-down { background: var(--card-back); box-shadow: var(--card-frame), var(--card-shadow); }
    .card.is-down > * { visibility: hidden; }
    .card.is-picked { outline: var(--sp-2) solid var(--select); }
  </style>
  <script type="module" src="solitaire.js"></script>
</head>
<!--
  Solitaire (Klondike), with cards of its own. solitaire.js does the rest.
-->
<body class="app solitaire">
  <nav class="menu-bar" aria-label="Menu"></nav>
  <main class="table" aria-label="Table"></main>
  <footer class="status-bar">
    <span class="status-bar__field" data-said></span>
    <span class="status-bar__field status-bar__field--size" data-score></span>
    <span class="status-bar__field status-bar__field--size" data-time></span>
  </footer>
</body>
</html>
