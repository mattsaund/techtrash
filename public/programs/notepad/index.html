<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled - Notepad</title>
  <script src="/js/app.js"></script>
  <script>
    // A site file from public/files/, like ?file=credits.txt. Its name goes
    // in the title right away so the window's title bar has it from the
    // start. Files on the shared disk are ?id=, and notepad.js names those
    // once the disk loads.
    const asked = new URLSearchParams(location.search).get("file");
    window.siteFile = asked && /^[\w.-]+\.txt$/.test(asked) ? asked : null;
    if (window.siteFile) document.title = `${window.siteFile} - Notepad`;
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
  <link rel="stylesheet" href="/css/explorer.css">
  <style>
    /* The text box, edge to edge under the menu bar, in the mono font. */
    .notepad__text {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 0 var(--sp-2);
      border: 0;
      border-top: var(--hairline) solid var(--face-shadow);
      background: var(--paper);
      color: var(--ink);
      font: 400 var(--fs-body)/var(--lh-mono) var(--font-mono);
      resize: none;
    }
    .notepad__text:focus-visible { border-color: var(--face-shadow); }
    .notepad__text.is-unwrapped { white-space: pre; overflow-x: auto; }
    .notepad .status-bar { padding: var(--sp-2); }
  </style>
  <script type="module" src="notepad.js"></script>
</head>
<!--
  XP's Notepad, for text files on the shared disk. It also shows the site's
  own files (like credits.txt) read-only. notepad.js does the rest.
-->
<body class="app notepad">
  <nav class="menu-bar" aria-label="Menu"></nav>
  <textarea class="notepad__text" spellcheck="false" autocomplete="off" aria-label="Text"></textarea>
  <main class="doc doc--mono notepad__site" hidden></main>
  <footer class="status-bar" hidden>
    <span class="status-bar__field"></span>
    <span class="status-bar__field status-bar__field--size" data-where></span>
  </footer>
</body>
</html>
