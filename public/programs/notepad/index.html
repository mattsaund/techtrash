<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled - Notepad</title>
  <script src="/js/app.js"></script>
  <script>
    // Opens a text file from public/files/, named in the address:
    // /programs/notepad/?file=credits.txt. The name goes in the title right
    // away, before the page has loaded, so the window's title bar has it
    // from the start.
    const asked = new URLSearchParams(location.search).get("file");
    const file = asked && /^[\w.-]+\.txt$/.test(asked) ? asked : null;
    if (file) document.title = `${file} - Notepad`;
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
</head>
<body class="app">
  <main class="doc doc--mono" id="text"></main>
  <script>
    // Addresses in the text are links, opening in a new tab: the web's, with
    // or without https:// (github.com/..., dejavu-fonts.github.io), and the
    // site's own files (/fonts/LGPL-2.1.txt). A name like cosmos.js isn't one.
    const ADDRESS = /(https?:\/\/\S+|(?<![\w.])\/[\w.-]+\/[\w./-]+|\b(?:[\w-]+\.)+(?:com|org|net|io|dev|app|gov|edu)(?:\/[\w./%-]*)?)/g;
    function linked(text) {
      const out = document.createDocumentFragment();
      text.split(ADDRESS).forEach((part, i) => {
        if (i % 2 === 0) return out.append(part);
        const link = document.createElement("a");
        link.textContent = part;
        link.href = /^(?:https?:|\/)/.test(part) ? part : `https://${part}`;
        link.target = "_blank";
        link.rel = "noopener";
        out.append(link);
      });
      return out;
    }

    if (file) {
      const text = document.getElementById("text");
      fetch(`/files/${file}`)
        .then((response) => (response.ok ? response.text() : Promise.reject()))
        .then((words) => text.replaceChildren(linked(words)))
        .catch(() => { text.textContent = `Cannot find the ${file} file.`; });
    }
  </script>
</body>
</html>
