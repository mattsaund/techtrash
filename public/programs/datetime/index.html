<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date and Time Properties</title>
  <script src="/js/app.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
  <style>
    .datetime { padding: var(--sp-8); gap: var(--sp-8); }
    .datetime__panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-8); }
    .datetime__panel[hidden] { display: none; }
    .datetime__groups { flex: 1; min-height: 0; display: flex; gap: var(--sp-8); }
    .datetime__groups fieldset { display: flex; flex-direction: column; align-items: center; gap: var(--sp-8); }
    .datetime__date { flex: 1; min-width: 0; }
    .datetime__row { display: flex; gap: var(--sp-4); align-self: stretch; }
    .datetime__row select { flex: 1; min-width: 0; }
    .datetime__row input { width: var(--button-w); }
    .datetime__foot { display: flex; justify-content: flex-end; gap: var(--sp-8); }
    .datetime__note { color: var(--ink); }

    /* The month as XP's calendar drew it, with the picked day in the
       selection blue. */
    .calendar {
      align-self: stretch;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: var(--sp-2);
      background: var(--paper);
      border: var(--hairline) solid var(--field-edge);
      text-align: center;
      user-select: none;
    }
    .calendar:focus-visible { outline: var(--hairline) dotted var(--focus); }
    .calendar__head { color: var(--group-ink); border-bottom: var(--hairline) solid var(--face-shadow); }
    .calendar__day { padding: var(--sp-2) 0; border: 0; background: none; color: var(--ink); }
    .calendar__day[aria-selected="true"] { background: var(--select); color: var(--select-ink); }

    /* The clock. datetime.js adds the marks and turns the hands. */
    .clock { width: var(--clock); height: var(--clock); }
    .clock__face { fill: var(--paper); stroke: var(--field-edge); }
    .clock__hour-mark { fill: var(--ink-muted); }
    .clock__minute-mark { fill: var(--face-shadow); }
    .clock__hand { stroke: var(--ink); stroke-linecap: round; }
    .clock__hand--second { stroke: var(--select); }
    .clock__pin { fill: var(--ink); }

    /* XP's spin box, a field with up and down buttons beside it. */
    .spin { display: flex; align-items: stretch; }
    .spin input { width: var(--spin-w); text-align: center; }
    .spin__buttons { display: flex; flex-direction: column; }
    .spin__buttons button {
      flex: 1;
      width: var(--spin-button);
      padding: 0;
      border: var(--hairline) solid var(--button-edge);
      background: var(--glyph-spin-up) center no-repeat, var(--button-face);
    }
    .spin__buttons button + button { background: var(--glyph-spin-down) center no-repeat, var(--button-face); border-top: 0; }
    .spin__buttons button:active { background-color: var(--face); }

    .datetime__zone { display: flex; flex-direction: column; gap: var(--sp-12); }
    .datetime__zone select { width: 100%; }
  </style>
  <script type="module" src="datetime.js"></script>
</head>
<!--
  Date and Time Properties, what the clock in the corner opens, with XP's
  three tabs. It's this visitor's own clock, not the shared desktop's, and a
  website can't set it, so Apply gets XP's refusal. datetime.js does the
  rest.
-->
<body class="app datetime">
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" aria-selected="true" data-tab="clock">Date &amp; Time</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="zone">Time Zone</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="internet">Internet Time</button>
  </div>

  <div class="tab-panel datetime__panel" role="tabpanel" data-panel="clock">
    <div class="datetime__groups">
      <fieldset class="datetime__date">
        <legend>Date</legend>
        <div class="datetime__row">
          <select aria-label="Month" data-month></select>
          <input type="number" aria-label="Year" min="1980" max="2099" data-year>
        </div>
        <div class="calendar" role="grid" tabindex="0" aria-label="Day" data-days></div>
      </fieldset>
      <fieldset>
        <legend>Time</legend>
        <svg class="clock" viewBox="-60 -60 120 120" aria-hidden="true">
          <circle class="clock__face" r="56"/>
          <g data-marks></g>
          <line class="clock__hand" x1="0" y1="6" x2="0" y2="-28" stroke-width="5" data-hand="hour"/>
          <line class="clock__hand" x1="0" y1="8" x2="0" y2="-42" stroke-width="3.5" data-hand="minute"/>
          <line class="clock__hand clock__hand--second" x1="0" y1="10" x2="0" y2="-46" stroke-width="1.5" data-hand="second"/>
          <circle class="clock__pin" r="3"/>
        </svg>
        <div class="spin">
          <input aria-label="Time" data-time>
          <span class="spin__buttons">
            <button type="button" aria-label="Later" data-step="1"></button>
            <button type="button" aria-label="Earlier" data-step="-1"></button>
          </span>
        </div>
      </fieldset>
    </div>
    <p class="datetime__note" data-zone-name></p>
  </div>

  <div class="tab-panel datetime__panel datetime__zone" role="tabpanel" data-panel="zone" hidden>
    <select aria-label="Time zone" disabled data-zone></select>
    <label class="check"><input type="checkbox" checked disabled> Automatically adjust clock for daylight saving changes</label>
    <p class="datetime__note">This is your own computer's time zone. Everyone else on techtrash.org sees theirs.</p>
  </div>

  <div class="tab-panel datetime__panel datetime__zone" role="tabpanel" data-panel="internet" hidden>
    <label class="check"><input type="checkbox" checked disabled> Automatically synchronize with an Internet time server</label>
    <div class="datetime__row">
      <label for="server">Server:</label>
      <select id="server" disabled><option>techtrash.org</option></select>
      <button class="button" type="button" data-sync>Update Now</button>
    </div>
    <p class="datetime__note" data-synced>Update Now checks your computer's clock against techtrash.org's.</p>
  </div>

  <div class="datetime__foot">
    <button class="button button--default" type="button" data-ok>OK</button>
    <button class="button" type="button" data-cancel>Cancel</button>
    <button class="button" type="button" data-apply disabled>Apply</button>
  </div>
</body>
</html>
