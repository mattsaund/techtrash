<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- IE-style title. site.js titled() keeps it updated. -->
  <title>Techtrash - Microsoft Internet Explorer</title>
  <!-- RSS (server/feed.js). -->
  <link rel="alternate" type="application/rss+xml" title="Techtrash" href="/rss.xml">
  <script>
    // Start this route's API requests before the modules load.
    // api() uses each response once. URLs must match the modules' calls.
    (() => {
      if (window.top === window) return;   // js/app.js redirects to the desktop
      let path = [];
      try {
        path = decodeURIComponent(location.search.slice(1)).split("/").filter(Boolean);
      } catch {}
      const [first, ...rest] = path;
      const urls = ["/api/me", "/api/blog/page?name=tagline", "/api/blog/page?name=footer", "/api/blog/page?name=blinkies"];
      if (!first) urls.push("/api/blog/page?name=home", "/api/blog/page?name=bulletin", "/api/blog/posts?featured");
      else if (first === "blog" && rest.length === 1) urls.push(`/api/blog/post?slug=${encodeURIComponent(rest[0])}`);
      else if ((first === "blog" && !rest.length) || first === "flag") urls.push("/api/blog/posts", "/api/blog/flags");
      else if (first === "pictures") urls.push("/api/blog/pictures");
      else if (first === "about") urls.push("/api/blog/page?name=about");
      const ask = (url) => fetch(url).then(async (r) => ({ ok: r.ok, status: r.status, answer: r.status === 204 ? {} : await r.json().catch(() => ({})) }), () => null);
      window.earlyAnswers = new Map(urls.map((url) => [url, ask(url)]));
    })();
  </script>
  <script src="/js/app.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/pages/blog/site.css">
  <!-- Preload the whole module graph instead of one import level at a time. -->
  <link rel="preload" href="/fonts/paper-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/pages/blog/sky/cosmos/planet.js" as="script">
  <link rel="modulepreload" href="/pages/blog/site.js">
  <link rel="modulepreload" href="/pages/blog/util.js">
  <link rel="modulepreload" href="/pages/blog/frame.js">
  <link rel="modulepreload" href="/pages/blog/front.js">
  <link rel="modulepreload" href="/pages/blog/post.js">
  <link rel="modulepreload" href="/pages/blog/viewer.js">
  <link rel="modulepreload" href="/pages/blog/content.js">
  <link rel="modulepreload" href="/pages/blog/comments.js">
  <link rel="modulepreload" href="/pages/blog/footer.js">
  <link rel="modulepreload" href="/pages/blog/own-words.js">
  <link rel="modulepreload" href="/pages/blog/sound.js">
  <link rel="modulepreload" href="/pages/blog/vendor/purify.js">
  <link rel="modulepreload" href="/js/shrink-image.js">
  <script type="module" src="/pages/blog/sky/space.js"></script>
  <script type="module" src="/pages/blog/blog.js"></script>
</head>
<body>
  <!-- Planets and stars (sky/space.js). -->
  <div class="sky" aria-hidden="true"></div>

  <!-- blog.js renders the route here. -->
  <main class="page wrap" id="page">
    <p class="meta">Loading...</p>
  </main>

  <!-- footer.js adds the footer words and blinkies above the line.
       credits.txt opens in the desktop's Notepad (js/app.js). -->
  <footer class="foot wrap">
    <p class="foot__line">
      <span><span class="copyleft" role="img" aria-label="Copyleft">©</span> Matthew Saunders</span>
      <a href="/programs/notepad/?file=credits.txt">credits</a>
      <a href="/rss.xml" target="_blank">rss</a>
    </p>
  </footer>

  <!-- Headline panel. frame.js clones it onto every page. -->
  <template id="hero">
    <section class="panel">
      <h1 class="title" aria-label="Techtrash">
        <span aria-hidden="true"><span class="title__letter hue-1">T</span><span class="title__letter hue-2">e</span><span class="title__letter hue-3">c</span><span class="title__letter hue-4">h</span><span class="title__letter hue-5">t</span><span class="title__letter hue-6">r</span><span class="title__letter hue-1">a</span><span class="title__letter hue-2">s</span><span class="title__letter hue-3">h</span></span>
      </h1>
      <!-- Default tagline. Keep in sync with server/feed.js. -->
      <p class="lede">My own little corner of the internet.</p>
      <!-- Panel buttons. frame.js sets aria-current on the current one. -->
      <div class="button-row">
        <a class="button hue-5" href="./" data-view="home">Home</a>
        <a class="button hue-4" href="?blog" data-view="blog">Blog</a>
        <a class="button hue-6" href="?pictures" data-view="pictures">Pictures</a>
        <a class="button hue-2" href="?about" data-view="about">About me</a>
      </div>
    </section>
  </template>
</body>
</html>
