<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <script src="/js/app.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
  <link rel="stylesheet" href="/pages/blog/blog.css">
  <script type="module" src="/pages/blog/blog.js"></script>
</head>
<body class="app">
  <!-- Drawn by blog.js: the topics, a topic, or a post. -->
  <main class="doc" id="blog">
    <p class="meta">Loading...</p>
  </main>

  <!-- The admin's forms. Only drawn for the admin, and the server checks again. -->
  <template id="new-topic">
    <form class="blog-form">
      <fieldset>
        <legend>New topic</legend>
        <label class="field-stack">Title<input name="title" maxlength="100" required></label>
        <label class="field-stack">Description<textarea name="description" rows="3" maxlength="1000"></textarea></label>
        <label class="field-stack">Picture<input type="file" name="picture" accept="image/*"></label>
        <div class="button-row"><button class="button">Post topic</button></div>
        <p class="blog-form__message" role="status"></p>
      </fieldset>
    </form>
  </template>

  <template id="new-post">
    <form class="blog-form">
      <fieldset>
        <legend>New post</legend>
        <label class="field-stack">Title<input name="title" maxlength="100" required></label>
        <label class="field-stack">Text<textarea name="body" rows="10" maxlength="50000" required></textarea></label>
        <div class="button-row"><button class="button">Post</button></div>
        <p class="blog-form__message" role="status"></p>
      </fieldset>
    </form>
  </template>
</body>
</html>
