<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>techtrash</title>
  <link rel="icon" href="/img/icons/xp/internet-shortcut.png">
  <!-- The blog, for feed readers (server/feed.js). -->
  <link rel="alternate" type="application/rss+xml" title="Techtrash" href="/rss.xml">
  <script>
    // Runs before anything paints. A visitor arrives logged on, straight into
    // the blog, and only a tab that has logged off comes back to the Welcome
    // screen. js/session.js does the rest.
    try {
      if (sessionStorage.getItem("techtrash:logged-off")) document.documentElement.classList.add("is-logged-off");
    } catch {}
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/xp.css">
  <link rel="stylesheet" href="/css/desktop.css">
  <!-- For Paint's Open and Save As, which it puts up out here (js/file-dialog.js). -->
  <link rel="stylesheet" href="/css/explorer.css">
  <script type="module" src="/js/desktop.js"></script>
</head>
<body>
  <!--
    The desktop. The icons are what's in the shared disk's Desktop folder
    (js/icons.js). js/desktop.js draws every window and the start menu's
    lists (from js/apps.js).
  -->
  <main class="desktop" aria-label="Desktop" data-wallpaper="stretch">
    <nav class="desktop__icons" aria-label="Desktop icons"></nav>

    <noscript>
      <section class="window desktop__noscript" aria-labelledby="noscript-title">
        <header class="title-bar">
          <h2 class="title-bar__text" id="noscript-title">techtrash</h2>
        </header>
        <div class="window__body">
          <p>The desktop needs JavaScript, but the blog doesn't:</p>
          <ul>
            <li><a href="/pages/blog/">Techtrash.org blog</a></li>
            <li><a href="/files/credits.txt">credits.txt</a></li>
          </ul>
        </div>
      </section>
    </noscript>
  </main>

  <div class="start-menu" id="start-menu" hidden>
    <div class="start-menu__head">
      <img class="start-menu__tile" src="/img/icons/xp/user-chess.png" alt="">
      <span>techtrash</span>
    </div>
    <div class="start-menu__hotline"></div>
    <div class="start-menu__cols">
      <div class="start-menu__left">
        <ul class="start-menu__list start-menu__programs" aria-label="Programs"></ul>
        <button class="start-menu__all" type="button" aria-haspopup="menu">All Programs<img src="/img/icons/xp/go.png" alt=""></button>
      </div>
      <ul class="start-menu__list start-menu__places" aria-label="Pages"></ul>
    </div>
    <div class="start-menu__foot">
      <button class="start-menu__button" data-ask-log-off><img src="/img/icons/xp/log-off.png" alt="">Log Off</button>
    </div>
  </div>

  <footer class="taskbar">
    <button class="start" aria-expanded="false" aria-controls="start-menu"><img class="start__flag" src="/img/icons/xp/start-flag.png" alt="">start</button>
    <div class="taskbar__tasks" role="group" aria-label="Open windows"></div>
    <div class="tray">
      <img class="tray__icon tray__lock" src="/img/icons/xp/padlock.png" alt="Locked" title="The desktop is locked: only the admin can change things on it right now." hidden>
      <!-- Opens Date and Time Properties when clicked. -->
      <button class="tray__clock-button" type="button" aria-label="Date and Time"><time class="tray__clock"></time></button>
    </div>
  </footer>

  <!-- Start > Log Off -->
  <div class="logoff" role="dialog" aria-modal="true" aria-labelledby="logoff-title" hidden>
    <div class="logoff__box">
      <h2 class="logoff__head" id="logoff-title">Log Off techtrash</h2>
      <div class="logoff__body">
        <button class="logoff__choice" data-switch-user><img src="/img/icons/xp/switch-user.png" alt=""><span>Switch User</span></button>
        <button class="logoff__choice" data-log-off><img src="/img/icons/xp/log-off.png" alt=""><span>Log Off</span></button>
      </div>
      <div class="logoff__foot">
        <button class="button" data-cancel>Cancel</button>
      </div>
    </div>
  </div>

  <!-- The Welcome screen. Shown only while <html> has .is-logged-off. -->
  <div class="logon" role="dialog" aria-modal="true" aria-labelledby="logon-title">
    <div class="logon__band logon__band--top"></div>
    <div class="logon__main">
      <div class="logon__intro">
        <p class="logon__brand" id="logon-title">techtrash</p>
        <p class="logon__prompt" role="status"></p>
      </div>
      <div class="logon__divider"></div>
      <!-- Everyone is techtrash. admin is me. It asks for a user name and
           password, and can post (server/admin.js). -->
      <ul class="logon__users" aria-label="Users">
        <li class="logon__entry">
          <button class="logon__user" data-user="techtrash">
            <img class="logon__picture" src="/img/icons/xp/user-chess.png" alt="">
            <span class="logon__who">
              <span class="logon__name">techtrash</span>
              <span class="logon__status" role="status"></span>
            </span>
          </button>
        </li>
        <li class="logon__entry">
          <button class="logon__user" data-user="admin" aria-expanded="false" aria-controls="logon-admin">
            <img class="logon__picture" src="/img/icons/xp/admin-key.png" alt="">
            <span class="logon__who">
              <span class="logon__name">admin</span>
              <span class="logon__status" role="status"></span>
            </span>
          </button>
          <form class="logon__form" id="logon-admin" hidden>
            <input name="username" placeholder="User name" aria-label="User name" autocomplete="username" required>
            <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
            <button class="logon__go" aria-label="Log on"><img src="/img/icons/xp/go.png" alt=""></button>
          </form>
        </li>
      </ul>
    </div>
    <div class="logon__band logon__band--bottom">
      <p class="logon__note">One desktop, shared by everyone here. Move something and everyone sees it move.</p>
    </div>
  </div>

  <!-- XP tints a selected icon half and half with the selection blue. The
       color is --select, set in css/xp.css. -->
  <svg class="filters" aria-hidden="true">
    <filter id="select-tint" color-interpolation-filters="sRGB">
      <feFlood class="select-tint__flood"/>
      <feComposite in2="SourceAlpha" operator="in" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="arithmetic" k2="0.5" k3="0.5"/>
    </filter>
  </svg>

  <template id="window-template">
    <section class="window">
      <header class="title-bar">
        <img class="title-bar__icon" alt="">
        <h2 class="title-bar__text"></h2>
        <div class="title-bar__controls">
          <button class="caption caption--min" aria-label="Minimize"></button>
          <button class="caption caption--max" aria-label="Maximize"></button>
          <button class="caption caption--close" aria-label="Close"></button>
        </div>
      </header>
      <div class="window__body window__body--flush">
        <iframe class="window__frame"></iframe>
      </div>
      <div class="window__grip" data-edge="n"></div>
      <div class="window__grip" data-edge="s"></div>
      <div class="window__grip" data-edge="e"></div>
      <div class="window__grip" data-edge="w"></div>
      <div class="window__grip" data-edge="nw"></div>
      <div class="window__grip" data-edge="ne"></div>
      <div class="window__grip" data-edge="sw"></div>
      <div class="window__grip" data-edge="se"></div>
    </section>
  </template>
</body>
</html>
